# The production build in docs/ is published under /font-comparator/ (see "build" script in package.json)
location = / {
    return 302 /font-comparator/;
}

# Serve the build from docs/ without the /font-comparator/ prefix, and fall back to Angular for any unknown URL
location ^~ /font-comparator/ {
    rewrite ^/font-comparator/(.*)$ /$1 break;
    try_files $uri /index.html;
}
